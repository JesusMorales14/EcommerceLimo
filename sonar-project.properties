# ─────────────────────────────────────────────────────────────────────────────
# SonarQube / SonarCloud — análisis estático del monorepo (frontend + backend)
# Las claves de organización/proyecto se pueden sobrescribir desde CI con
# -Dsonar.organization=... -Dsonar.projectKey=...
# ─────────────────────────────────────────────────────────────────────────────
sonar.projectKey=JesusMorales14_EcommerceLimo
sonar.organization=jesusmorales14
sonar.projectName=EcommerceLimo
sonar.sourceEncoding=UTF-8

# Código fuente y pruebas
sonar.sources=frontend/src,backend/src,backend/prisma
sonar.tests=frontend/src,frontend/e2e,backend/src,backend/test
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts,frontend/e2e/**/*.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts,**/environments/**,backend/prisma/migrations/**,backend/prisma/seed-data/**,**/testing/**,**/test-setup.ts

# Cobertura (rutas reescritas en CI para que sean relativas a la raíz)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,backend/coverage/lcov.info
sonar.coverage.exclusions=**/main.ts,**/*.module.ts,**/*.routes.ts,**/*.config.ts,**/*.dto.ts,**/models/**,**/*.data.ts,backend/prisma/**,frontend/e2e/**,backend/test/**

# Duplicación: los DTOs y datos estáticos no cuentan
sonar.cpd.exclusions=**/*.dto.ts,**/*.data.ts,**/data/**

sonar.typescript.tsconfigPaths=frontend/tsconfig.app.json,backend/tsconfig.json
