<nav class="bottom-nav" aria-label="Navegación principal">
  <a
    routerLink="/"
    routerLinkActive="active"
    [routerLinkActiveOptions]="{ exact: true }"
    class="nav-tab"
  >
    <span class="material-symbols-outlined" aria-hidden="true">home</span>
    <span class="nav-label">Inicio</span>
  </a>

  <button type="button" class="nav-tab nav-cart-fab" (click)="openCart()" [attr.aria-label]="'Abrir carrito (' + cartService.count() + ' productos)'">
    <span class="nav-fab-circle">
      <span class="material-symbols-outlined" aria-hidden="true">shopping_bag</span>
      @if (cartService.count() > 0) {
        <span class="nav-badge">{{ cartService.count() }}</span>
      }
    </span>
    <span class="nav-label">Carrito</span>
  </button>

  <a routerLink="/favorites" routerLinkActive="active" class="nav-tab">
    <span class="nav-icon-wrap">
      <span class="material-symbols-outlined" aria-hidden="true">favorite</span>
      @if (favService.count() > 0) {
        <span class="nav-badge nav-badge-fav">{{ favService.count() }}</span>
      }
    </span>
    <span class="nav-label">Favoritos</span>
  </a>
</nav>
