<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="material-symbols-outlined">eco</span>
      <span>GreenHouse</span>
    </div>
    <h1>Crear cuenta</h1>
    <p class="auth-sub">Regístrate para comenzar a comprar</p>

    @if (error()) {
      <div class="auth-error">{{ error() }}</div>
    }

    <form (ngSubmit)="submit()">
      <div class="field">
        <label for="name">Nombre completo *</label>
        <input id="name" type="text" [(ngModel)]="name" name="name" placeholder="Juan Pérez" required>
      </div>
      <div class="field">
        <label for="email">Correo electrónico *</label>
        <input id="email" type="email" [(ngModel)]="email" name="email" placeholder="tu@correo.com" required autocomplete="email">
      </div>
      <div class="field">
        <label for="phone">Teléfono (opcional)</label>
        <input id="phone" type="tel" [(ngModel)]="phone" name="phone" placeholder="+56 9 1234 5678">
      </div>
      <div class="field">
        <label for="password">Contraseña *</label>
        <input id="password" type="password" [(ngModel)]="password" name="password" placeholder="Mínimo 6 caracteres" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn-auth" [disabled]="loading()">
        @if (loading()) { <span>Creando cuenta...</span> } @else { <span>Crear cuenta</span> }
      </button>
    </form>

    <p class="auth-link">
      ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
    </p>
  </div>
</div>
