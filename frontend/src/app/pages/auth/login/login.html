<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="material-symbols-outlined">eco</span>
      <span>EcommerceLimo</span>
    </div>
    <h1>Iniciar sesión</h1>
    <p class="auth-sub">Ingresa tus datos para continuar</p>

    @if (error()) {
      <div class="auth-error">{{ error() }}</div>
    }

    <form (ngSubmit)="submit()" #f="ngForm">
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="tu@correo.com"
          required
          autocomplete="email"
        />
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="••••••••"
          required
          autocomplete="current-password"
        />
      </div>
      <button type="submit" class="btn-auth" [disabled]="loading()">
        @if (loading()) {
          <span>Cargando...</span>
        } @else {
          <span>Ingresar</span>
        }
      </button>
    </form>

    <p class="auth-link">¿No tienes cuenta? <a routerLink="/register">Regístrate aquí</a></p>
  </div>
</div>
