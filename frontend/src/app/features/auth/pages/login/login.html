<app-auth-card heading="Iniciar sesión" subtitle="Ingresa tus datos para continuar" [error]="error()">
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="field">
      <label for="email">Correo electrónico</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        placeholder="tu@correo.com"
        autocomplete="email"
        [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid"
        aria-describedby="email-error"
      />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <small id="email-error" class="field-error">Ingresa un correo válido.</small>
      }
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        placeholder="••••••••"
        autocomplete="current-password"
        [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid"
      />
    </div>
    <button type="submit" class="btn-auth" [disabled]="loading()">
      {{ loading() ? 'Cargando...' : 'Ingresar' }}
    </button>
  </form>

  <ng-container authFooter>¿No tienes cuenta? <a routerLink="/register">Regístrate aquí</a></ng-container>
</app-auth-card>
