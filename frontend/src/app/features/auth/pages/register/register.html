<app-auth-card heading="Crear cuenta" subtitle="Regístrate para comprar más rápido" [error]="error()">
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="field">
      <label for="name">Nombre completo *</label>
      <input id="name" type="text" formControlName="name" placeholder="Juan Pérez" autocomplete="name" [attr.aria-invalid]="showError('name')" />
      @if (showError('name')) {
        <small class="field-error">Ingresa tu nombre.</small>
      }
    </div>
    <div class="field">
      <label for="email">Correo electrónico *</label>
      <input id="email" type="email" formControlName="email" placeholder="tu@correo.com" autocomplete="email" [attr.aria-invalid]="showError('email')" />
      @if (showError('email')) {
        <small class="field-error">Ingresa un correo válido.</small>
      }
    </div>
    <div class="field">
      <label for="phone">Teléfono (opcional)</label>
      <input id="phone" type="tel" formControlName="phone" placeholder="+51 987 654 321" autocomplete="tel" />
    </div>
    <div class="field">
      <label for="password">Contraseña *</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        [placeholder]="'Mínimo ' + minPasswordLength + ' caracteres'"
        autocomplete="new-password"
        [attr.aria-invalid]="showError('password')"
      />
      @if (showError('password')) {
        <small class="field-error">La contraseña debe tener al menos {{ minPasswordLength }} caracteres.</small>
      }
    </div>
    <button type="submit" class="btn-auth" [disabled]="loading()">
      {{ loading() ? 'Creando cuenta...' : 'Crear cuenta' }}
    </button>
  </form>

  <ng-container authFooter>¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></ng-container>
</app-auth-card>
