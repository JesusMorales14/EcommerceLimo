@let product = this.product();
<div class="product-card">
  <div class="card-name">{{ product.name }}</div>

  <div class="card-row">
    <span class="card-label">CATEGORÍA</span>
    <span class="cat-badge">{{ product.category }}</span>
  </div>

  <div class="card-row">
    <span class="card-label">PRECIO</span>
    <span class="card-price">{{ product.price | currencyPen }}</span>
  </div>

  <div class="card-row">
    <span class="card-label">STOCK</span>
    <span [class.low-stock]="product.stock < lowStock">{{ product.stock }}</span>
  </div>

  <div class="card-row">
    <span class="card-label">OFERTA</span>
    @if (product.isOffer) {
      <span class="offer-badge">Oferta</span>
    } @else {
      <span class="no-offer">—</span>
    }
  </div>

  <div class="card-row card-actions">
    <span class="card-label">ACCIONES</span>
    <div class="actions-btns">
      <button type="button" class="btn-edit" (click)="edit.emit(product)" [attr.aria-label]="'Editar ' + product.name">
        <span class="material-symbols-outlined" aria-hidden="true">edit</span>
      </button>
      <button type="button" class="btn-del" (click)="remove.emit(product)" [attr.aria-label]="'Eliminar ' + product.name">
        <span class="material-symbols-outlined" aria-hidden="true">delete</span>
      </button>
    </div>
  </div>
</div>
