<div class="table-wrap">
  <table>
    <caption class="visually-hidden">Usuarios registrados</caption>
    <thead>
      <tr>
        <th scope="col">#</th>
        <th scope="col">Nombre</th>
        <th scope="col">Email</th>
        <th scope="col">Rol</th>
        <th scope="col">Teléfono</th>
        <th scope="col">Registro</th>
      </tr>
    </thead>
    <tbody>
      @for (user of users(); track user.id) {
        <tr>
          <td class="col-id" data-label="#">{{ user.id }}</td>
          <td class="col-name" data-label="Nombre">
            <div class="user-cell">
              <div class="user-avatar" aria-hidden="true">{{ user.name.charAt(0).toUpperCase() }}</div>
              {{ user.name }}
            </div>
          </td>
          <td class="col-email" data-label="Email">{{ user.email }}</td>
          <td class="col-role" data-label="Rol">
            <span class="role-badge" [class.admin]="user.role === 'ADMIN'">{{ user.role }}</span>
          </td>
          <td class="col-phone" data-label="Teléfono">{{ user.phone ?? '—' }}</td>
          <td class="col-date" data-label="Registro">{{ user.createdAt | date: 'dd MMM yyyy' }}</td>
        </tr>
      }
    </tbody>
  </table>
</div>
