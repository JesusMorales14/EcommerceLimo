<form class="edit-card" [formGroup]="form" (ngSubmit)="save()" aria-labelledby="edit-profile-title">
  <h2 id="edit-profile-title">Editar perfil</h2>
  <div class="edit-fields">
    <label>
      Nombre
      <input type="text" formControlName="name" placeholder="Tu nombre" autocomplete="name" />
      @if (form.controls.name.touched && form.controls.name.invalid) {
        <small class="edit-error" role="alert">El nombre es obligatorio.</small>
      }
    </label>
    <label>
      Teléfono
      <input type="tel" formControlName="phone" placeholder="+51 987 654 321" autocomplete="tel" />
    </label>
    <label class="full-width">
      Dirección
      <input type="text" formControlName="address" placeholder="Calle, número, distrito, ciudad" autocomplete="street-address" />
    </label>
  </div>
  @if (error()) {
    <p class="edit-error" role="alert">{{ error() }}</p>
  }
  <div class="edit-actions">
    <button type="button" class="btn-cancel" (click)="closed.emit()">Cancelar</button>
    <button type="submit" class="btn-save" [disabled]="saving()">
      @if (saving()) {
        <span class="material-symbols-outlined spin" aria-hidden="true">progress_activity</span>
        <span class="visually-hidden">Guardando…</span>
      } @else {
        Guardar cambios
      }
    </button>
  </div>
</form>
