name: CI — EcommerceLimo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: Backend — NestJS unit tests
  # ──────────────────────────────────────────────
  backend-tests:
    name: Backend · NestJS Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system build tools (required by bcrypt)
        run: sudo apt-get install -y build-essential python3

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_test

      - name: Run unit tests
        run: npm test -- --passWithNoTests --forceExit
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_test
          JWT_SECRET: ci_test_secret_key_for_github_actions
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          MAIL_HOST: smtp.gmail.com
          MAIL_PORT: '587'
          MAIL_USER: test@example.com
          MAIL_PASS: placeholder
          MAIL_FROM: test@example.com

  # ──────────────────────────────────────────────
  # JOB 2: Backend — Build check
  # ──────────────────────────────────────────────
  backend-build:
    name: Backend · Build
    runs-on: ubuntu-latest
    needs: backend-tests

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system build tools (required by bcrypt)
        run: sudo apt-get install -y build-essential python3

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_test

      - name: Build NestJS application
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_test
          JWT_SECRET: ci_test_secret_key_for_github_actions
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          MAIL_HOST: smtp.gmail.com
          MAIL_PORT: '587'
          MAIL_USER: test@example.com
          MAIL_PASS: placeholder
          MAIL_FROM: test@example.com

  # ──────────────────────────────────────────────
  # JOB 3: Frontend — Angular unit tests
  # ──────────────────────────────────────────────
  frontend-tests:
    name: Frontend · Angular Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Install dependencies
        run: bun install

      - name: Run unit tests
        run: bun run ng test --watch=false
        env:
          CI: true

  # ──────────────────────────────────────────────
  # JOB 4: Frontend — Production build
  # ──────────────────────────────────────────────
  frontend-build:
    name: Frontend · Production Build
    runs-on: ubuntu-latest
    needs: frontend-tests

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Install dependencies
        run: bun install

      - name: Build Angular for production
        run: bun run ng build --configuration production
