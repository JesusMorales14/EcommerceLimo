name: 🤖 Revisión IA de Código — Claude

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  ai-code-review:
    name: "🤖 Análisis IA — Claude Haiku"
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Obtener diff del PR (solo .ts / .html / .scss)
        run: |
          git diff ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} \
            -- '*.ts' '*.html' '*.scss' \
            | head -c 14000 > /tmp/pr.diff
          echo "Tamaño del diff: $(wc -c < /tmp/pr.diff) bytes"

      - name: Analizar con Claude y publicar revisión en el PR
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node - << 'NODEJS_EOF'
          const https  = require('https');
          const fs     = require('fs');
          const { execSync } = require('child_process');

          const apiKey = process.env.ANTHROPIC_API_KEY;
          if (!apiKey) {
            console.log('⚠️  ANTHROPIC_API_KEY no configurada — omitiendo revisión IA.');
            process.exit(0);
          }

          const diff     = fs.readFileSync('/tmp/pr.diff', 'utf8').trim();
          const prTitle  = process.env.PR_TITLE || '(sin título)';

          if (!diff) {
            console.log('ℹ️  Sin cambios relevantes en .ts/.html/.scss — omitiendo revisión.');
            process.exit(0);
          }

          const prompt = [
            `Eres un revisor senior especializado en Angular 21 (standalone + signals) y NestJS 11.`,
            `Analiza el siguiente diff de un Pull Request titulado: "${prTitle}".`,
            `Redacta tu revisión **en español**, estructurada exactamente así:`,
            ``,
            `## 🔴 Problemas críticos`,
            `(bugs, vulnerabilidades, lógica incorrecta — si no hay, escribe "Ninguno")`,
            ``,
            `## 🟡 Sugerencias de mejora`,
            `(rendimiento, legibilidad, buenas prácticas — máx. 5 puntos)`,
            ``,
            `## 🟢 Puntos positivos`,
            `(qué está bien implementado — máx. 3 puntos)`,
            ``,
            `## ✅ Veredicto`,
            `Una sola frase resumiendo si el PR puede aprobarse o requiere cambios.`,
            ``,
            `Sé conciso y directo. No repitas el diff.`,
            ``,
            `\`\`\`diff`,
            diff,
            `\`\`\``,
          ].join('\n');

          const payload = JSON.stringify({
            model: 'claude-haiku-4-5-20251001',
            max_tokens: 900,
            messages: [{ role: 'user', content: prompt }],
          });

          const options = {
            hostname: 'api.anthropic.com',
            path: '/v1/messages',
            method: 'POST',
            headers: {
              'x-api-key': apiKey,
              'anthropic-version': '2023-06-01',
              'content-type': 'application/json',
              'content-length': Buffer.byteLength(payload),
            },
          };

          const req = https.request(options, (res) => {
            let body = '';
            res.on('data', (chunk) => (body += chunk));
            res.on('end', () => {
              let review;
              try {
                review = JSON.parse(body).content[0].text;
              } catch (e) {
                console.error('Error parseando respuesta de Claude:', body);
                process.exit(0);
              }

              const comment = [
                '## 🤖 Revisión Automática de Código — Claude AI',
                '',
                review,
                '',
                '---',
                '<sub>⚡ Análisis generado por <strong>Claude Haiku</strong> · Pipeline CI/CD EcommerceLimo · <em>4.6 Calidad 4.0</em></sub>',
              ].join('\n');

              fs.writeFileSync('/tmp/ai-review.md', comment);

              try {
                execSync(
                  `gh pr comment ${process.env.PR_NUMBER} --body-file /tmp/ai-review.md`,
                  { stdio: 'inherit' }
                );
                console.log('✅ Revisión IA publicada en el PR #' + process.env.PR_NUMBER);
              } catch (err) {
                console.error('Error publicando comentario:', err.message);
              }
            });
          });

          req.on('error', (e) => {
            console.error('Error llamando a Claude API:', e.message);
            process.exit(0);
          });

          req.write(payload);
          req.end();
          NODEJS_EOF
