name: 🤖 Revisión IA de Código — Gemini

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  ai-code-review:
    name: "🤖 Análisis IA — Gemini Flash"
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Obtener diff del PR (solo .ts / .html / .scss)
        run: |
          git diff ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} \
            -- '*.ts' '*.html' '*.scss' \
            | head -c 12000 > /tmp/pr.diff
          echo "Bytes en diff: $(wc -c < /tmp/pr.diff)"

      - name: Analizar con Gemini y generar revisión
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/gemini_review.py

      - name: Publicar revisión en el PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s /tmp/ai-review.md ]; then
            gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/ai-review.md
            echo "✅ Comentario publicado en PR #${{ github.event.pull_request.number }}"
          else
            echo "ℹ️  Sin revisión que publicar."
          fi
