# Actualizaciones automáticas de dependencias (agrupadas para reducir ruido).
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', 'angular-eslint']
      dev-tooling:
        dependency-type: development

  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      nestjs:
        patterns: ['@nestjs/*']
      prisma:
        patterns: ['prisma', '@prisma/*']
      dev-tooling:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }

  - package-ecosystem: docker
    directories: [/frontend, /backend]
    schedule: { interval: monthly }
